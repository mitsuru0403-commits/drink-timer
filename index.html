<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HydroCare Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4fc3f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3105/3105807.png">
    <style>
        :root {
            --main-blue: #4fc3f7; --dark-blue: #0288d1; --bg-color: #f0faff;
            --card-bg: #ffffff; --text-color: #37474f; --accent-orange: #ff9800;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 20px 0; display: flex; flex-direction: column; align-items: center;
        }
        .card {
            background: var(--card-bg); padding: 1.5rem; border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05); width: 90%; max-width: 450px;
            margin-bottom: 20px; box-sizing: border-box;
        }
        h1 { color: var(--dark-blue); margin: 0 0 1rem; font-size: 1.4rem; text-align: center; }
        h2 { font-size: 0.9rem; color: var(--dark-blue); margin: 0 0 10px; border-left: 4px solid var(--main-blue); padding-left: 8px; }
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .input-group { display: flex; flex-direction: column; margin-bottom: 10px; }
        .input-group label { font-size: 0.7rem; color: #78909c; margin-bottom: 2px; }
        .input-group input { padding: 8px; border: 1px solid #cfd8dc; border-radius: 8px; font-size: 0.9rem; }
        .timer-card { background: linear-gradient(135deg, #4fc3f7, #0288d1); color: white; padding: 1.2rem; border-radius: 15px; text-align: center; margin-bottom: 15px; }
        .timer-display { font-size: 3rem; font-weight: bold; margin: 5px 0; }
        .progress-bar-bg { background: #eee; border-radius: 10px; height: 12px; overflow: hidden; margin: 10px 0; }
        .progress-bar-fill { background: var(--main-blue); height: 100%; width: 0%; transition: width 0.5s; }
        .drink-btn {
            background: var(--accent-orange); color: white; border: none; padding: 1rem;
            font-size: 1.2rem; border-radius: 50px; cursor: pointer; width: 100%;
            font-weight: bold; box-shadow: 0 4px 15px rgba(255,152,0,0.3);
        }
        .schedule-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; margin-top: 10px; }
        .schedule-item { font-size: 0.7rem; background: #f5f5f5; padding: 6px 2px; border-radius: 6px; text-align: center; color: #999; }
        .schedule-item.next { background: #e3f2fd; color: var(--dark-blue); font-weight: bold; border: 1px solid var(--main-blue); }
        .schedule-item.done { background: #c8e6c9; color: #2e7d32; text-decoration: line-through; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; font-size: 0.7rem; }
        .calendar-day { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; position: relative; border: 1px solid #f9f9f9; }
        .goal-dot { width: 4px; height: 4px; background: var(--main-blue); border-radius: 50%; position: absolute; bottom: 2px; }
        .notify-test { background: none; border: 1px solid #ccc; color: #999; padding: 5px; font-size: 0.6rem; border-radius: 5px; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h2>⚙️ 設定</h2>
    <div class="settings-grid">
        <div class="input-group"><label>開始</label><input type="time" id="start-time" value="06:00"></div>
        <div class="input-group"><label>終了</label><input type="time" id="end-time" value="22:00"></div>
        <div class="input-group"><label>目標(ml)</label><input type="number" id="goal-ml" value="2000"></div>
        <div class="input-group"><label>1回(ml)</label><input type="number" id="serving-ml" value="200"></div>
    </div>
</div>

<div class="card">
    <h1>💧 HydroCare</h1>
    <div class="timer-card">
        <div id="timer-status" style="font-size:0.8rem">次の給水まで</div>
        <div id="timer-display" class="timer-display">--:--</div>
        <div id="next-time-info" style="font-size:0.8rem; font-weight:bold;">予定 --:--</div>
    </div>
    <div class="progress-info" style="display:flex; justify-content:space-between; font-size:0.8rem; font-weight:bold;">
        <span>進捗</span><span id="progress-text">0 / 2000 ml</span>
    </div>
    <div class="progress-bar-bg"><div id="progress-bar" class="progress-bar-fill"></div></div>
    <button id="drink-btn" class="drink-btn">水を飲んだ！</button>
    <div id="schedule-list" class="schedule-list"></div>
    <center><button class="notify-test" onclick="sendNotification('通知テスト', 'このように通知が届きます')">通知テスト送信</button></center>
</div>

<div class="card">
    <div id="calendar-month" style="text-align:center; font-weight:bold; margin-bottom:10px; font-size:0.9rem;"></div>
    <div class="calendar-grid" id="calendar-grid"></div>
</div>

<script>
    // --- PWA & 通知設定 ---
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
    }

    async function requestPermission() {
        if ('Notification' in window) {
            await Notification.requestPermission();
        }
    }

    function sendNotification(title, body) {
        if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage({ type: 'NOTIFY', title, body });
        }
    }

    // --- ロジック ---
    let logs = JSON.parse(localStorage.getItem('water_logs_pwa')) || {};
    let config = JSON.parse(localStorage.getItem('water_config_pwa')) || { startTime: "06:00", endTime: "22:00", goal: 2000, serving: 200 };
    let schedule = [];
    let lastNotifiedIndex = -1; // 同じ時間に何度も通知しないためのガード

    function init() {
        requestPermission();
        document.getElementById('start-time').value = config.startTime;
        document.getElementById('end-time').value = config.endTime;
        document.getElementById('goal-ml').value = config.goal;
        document.getElementById('serving-ml').value = config.serving;
        
        refreshAll();
        setInterval(updateTimer, 1000);
        
        // 設定変更イベント
        ['start-time', 'end-time', 'goal-ml', 'serving-ml'].forEach(id => {
            document.getElementById(id).onchange = refreshAll;
        });
    }

    function refreshAll() {
        config = {
            startTime: document.getElementById('start-time').value,
            endTime: document.getElementById('end-time').value,
            goal: parseInt(document.getElementById('goal-ml').value),
            serving: parseInt(document.getElementById('serving-ml').value)
        };
        localStorage.setItem('water_config_pwa', JSON.stringify(config));
        calculateSchedule();
        updateUI();
        renderScheduleUI();
        renderCalendar();
    }

    function calculateSchedule() {
        const [sH, sM] = config.startTime.split(':').map(Number);
        const [eH, eM] = config.endTime.split(':').map(Number);
        const startMin = sH * 60 + sM;
        const endMin = eH * 60 + eM;
        const steps = Math.ceil(config.goal / config.serving);
        const interval = steps > 1 ? (endMin - startMin) / (steps - 1) : 0;

        schedule = [];
        for (let i = 0; i < steps; i++) {
            const time = new Date();
            const m = startMin + (interval * i);
            time.setHours(Math.floor(m / 60), Math.floor(m % 60), 0, 0);
            schedule.push(time);
        }
    }

    function updateTimer() {
        const now = new Date();
        const today = new Date().toLocaleString('sv').split(' ')[0];
        const drankCount = Math.floor((logs[today] || 0) / config.serving);
        
        if (drankCount >= schedule.length) {
            document.getElementById('timer-display').innerText = "DONE";
            return;
        }

        const nextTarget = schedule[drankCount];
        const diff = nextTarget - now;

        // --- 通知ロジック ---
        // 予定時刻になり、かつ、まだこの回の通知を送っていない場合
        if (diff <= 0 && lastNotifiedIndex !== drankCount) {
            sendNotification("水分補給の時間です！", `予定時刻(${nextTarget.getHours()}:${nextTarget.getMinutes().toString().padStart(2,'0')})を過ぎました。${config.serving}ml飲みましょう！`);
            lastNotifiedIndex = drankCount;
        }

        if (diff > 0) {
            const mins = Math.floor(diff / 60000);
            const secs = Math.floor((diff % 60000) / 1000);
            document.getElementById('timer-display').innerText = `${mins}:${secs.toString().padStart(2,'0')}`;
            document.getElementById('timer-status').innerText = "次の給水まで";
        } else {
            document.getElementById('timer-display').innerText = "00:00";
            document.getElementById('timer-status').innerText = "給水タイム！";
        }
        document.getElementById('next-time-info').innerText = `予定 ${nextTarget.getHours()}:${nextTarget.getMinutes().toString().padStart(2,'0')}`;
    }

    function updateUI() {
        const today = new Date().toLocaleString('sv').split(' ')[0];
        const current = logs[today] || 0;
        const percent = Math.min((current / config.goal) * 100, 100);
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('progress-text').innerText = `${current} / ${config.goal} ml`;
    }

    function renderScheduleUI() {
        const list = document.getElementById('schedule-list');
        const today = new Date().toLocaleString('sv').split(' ')[0];
        const drankCount = Math.floor((logs[today] || 0) / config.serving);
        list.innerHTML = '';
        schedule.forEach((time, i) => {
            const div = document.createElement('div');
            div.className = `schedule-item ${i < drankCount ? 'done' : (i === drankCount ? 'next' : '')}`;
            div.innerText = `${time.getHours()}:${time.getMinutes().toString().padStart(2,'0')}`;
            list.appendChild(div);
        });
    }

    document.getElementById('drink-btn').onclick = () => {
        const today = new Date().toLocaleString('sv').split(' ')[0];
        logs[today] = (logs[today] || 0) + config.serving;
        localStorage.setItem('water_logs_pwa', JSON.stringify(logs));
        refreshAll();
    };

    function renderCalendar() {
        const now = new Date();
        document.getElementById('calendar-month').innerText = `${now.getFullYear()}年 ${now.getMonth()+1}月`;
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        const lastDate = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
        for (let d = 1; d <= lastDate; d++) {
            const dateStr = `${now.getFullYear()}-${(now.getMonth()+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
            const el = document.createElement('div');
            el.className = 'calendar-day';
            el.innerText = d;
            if (logs[dateStr] >= config.goal) {
                const dot = document.createElement('div');
                dot.className = 'goal-dot';
                el.appendChild(dot);
            }
            grid.appendChild(el);
        }
    }

    init();
</script>
</body>
</html>
